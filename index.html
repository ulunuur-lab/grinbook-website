<meta name="description" content="Меллонбек — Telegram гуруҳингиздаги ҳисобчи. У овозли хабардан чек ёзади ва ҳар бир мижознинг қарзини юритади.">

<style>
/* Layout: three stacked screens on one vertical track. About sits above the main screen,
   "What does Mellonbek do" and the demo sit below; moving between them pushes the main screen away.
   "What does Mellonbek do" is a two-tab showcase: big headline, a laptop running Telegram, a dot pager. */
:root {
  --ink: #04140b;
  --leaf: #3ddc5a;
  --leaf-hi: #7cf592;
  --emerald-0: #021f10;
  --emerald-1: #04401f;
  --emerald-2: #076a33;
  --paper: #f2f8f3;
  --mist: rgba(242, 248, 243, 0.76);
  --faint: rgba(242, 248, 243, 0.5);
  --line: rgba(190, 255, 210, 0.2);
  --glass: rgba(220, 255, 230, 0.08);

  --tg-bg: #0e1621;
  --tg-side: #17212b;
  --tg-head: #17212b;
  --tg-in: #182533;
  --tg-out: #2b5278;
  --tg-active: #2b5278;
  --tg-link: #6ab3f3;
  --tg-meta: #6d7f8f;
  --tg-btn: rgba(43, 82, 120, 0.6);
  --tg-name: #67d16f;

  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tg-font: -apple-system, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.72, 0, 0.18, 1);
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--emerald-0); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.55; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--leaf-hi); outline-offset: 3px; border-radius: 8px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── The track ─────────────────────────────────────── */
.app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
.track { position: absolute; inset: 0; transition: transform 1s var(--ease); will-change: transform; }
.view { position: absolute; left: 0; right: 0; height: 100%; overflow: hidden; overflow: clip; }
.view[data-view="about"] { top: -100%; }
.view[data-view="main"] { top: 0; }
.view[data-view="how"] { top: 100%; }
.view[data-view="demo"] { top: 200%; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; z-index: 1; }
.scroll-inner { padding-block: calc(env(safe-area-inset-top, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 32px); }
@media (prefers-reduced-motion: reduce) { .track { transition: none; } }

/* ── Shining emerald ground ───────────────────────── */
.shine { position: absolute; inset: 0; z-index: 0; overflow: hidden;
  background:
    radial-gradient(55% 45% at 12% 0%, rgba(150, 255, 190, 0.34), transparent 70%),
    radial-gradient(45% 40% at 92% 18%, rgba(60, 230, 130, 0.28), transparent 70%),
    radial-gradient(70% 55% at 50% 108%, rgba(20, 190, 95, 0.42), transparent 72%),
    linear-gradient(162deg, var(--emerald-0) 0%, var(--emerald-1) 30%, var(--emerald-2) 55%, var(--emerald-1) 80%, var(--emerald-0) 100%);
}
.shine::before { content: ""; position: absolute; inset: -30%;
  background: conic-gradient(from 205deg at 50% 0%, transparent 0deg, rgba(200, 255, 220, 0.16) 12deg, transparent 30deg, rgba(200, 255, 220, 0.1) 55deg, transparent 75deg, rgba(200, 255, 220, 0.14) 110deg, transparent 135deg, rgba(200, 255, 220, 0.08) 160deg, transparent 180deg);
  filter: blur(22px); mix-blend-mode: screen; animation: beams 22s ease-in-out infinite alternate; }
.shine::after { content: ""; position: absolute; inset: 0; opacity: 0.14; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.sparkle { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150, 255, 190, 0.22), transparent); filter: blur(10px); animation: drift 16s ease-in-out infinite alternate; pointer-events: none; }
@keyframes beams { from { transform: rotate(-7deg) translateX(-3%); } to { transform: rotate(7deg) translateX(3%); } }
@keyframes drift { from { transform: translate(-40px, 20px) scale(0.95); } to { transform: translate(60px, -30px) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .shine::before, .sparkle { animation: none; } }

/* ── Main screen ──────────────────────────────────── */
.main { display: grid; grid-template-rows: auto 1fr; isolation: isolate; }
.photo { position: absolute; inset: -4%; z-index: -3; width: 108%; height: 108%; max-width: none; object-fit: cover; object-position: 50% 45%; animation: sway 26s ease-in-out infinite alternate; }
@keyframes sway { 0% { transform: translate(-1.2%, 0.4%) scale(1) rotate(-0.25deg); } 50% { transform: translate(0.6%, -0.5%) scale(1.035) rotate(0.15deg); } 100% { transform: translate(1.4%, 0.3%) scale(1.02) rotate(0.3deg); } }
.wind { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .photo { animation: none; } .wind { display: none; } }
.main::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 34% 38% at 50% 46%, rgba(2, 18, 8, 0.32), transparent 72%),
    linear-gradient(to bottom, rgba(2, 10, 5, 0.42) 0%, rgba(2, 10, 5, 0) 22%, rgba(2, 10, 5, 0) 52%, rgba(2, 14, 7, 0.72) 100%); }
.nav { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 0; position: relative; z-index: 3; }
.about-link { background: none; border: 0; padding: 8px 2px; font-weight: 800; font-size: 16px; letter-spacing: 0.01em; cursor: pointer; text-decoration: none; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.75); }
.about-link { justify-self: end; }
.about-link:hover { color: var(--leaf-hi); }
.wordmark, .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: clamp(17px, 2vw, 22px); letter-spacing: 0.06em; text-decoration: none; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); white-space: nowrap; }
.wordmark img, .brand img { width: 1.6em; height: 1.6em; max-width: none; flex: none; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45)); }
.wordmark span, .brand span { color: var(--leaf-hi); }
.wordmark b, .brand b { font-weight: inherit; }
.brand { font-size: 17px; }
@media (max-width: 480px) { .wordmark b { display: none; } .wordmark img { width: 36px; height: 36px; } }
.about-logo { display: block; width: 76px; height: 76px; max-width: none; margin-bottom: 18px; filter: drop-shadow(0 6px 24px rgba(61, 220, 90, 0.35)); }

.lang { position: relative; }
.lang-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(4, 18, 9, 0.45); border: 1px solid rgba(242, 248, 243, 0.28); border-radius: 999px; padding: 7px 13px 7px 11px; font-size: 14px; font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.lang-btn svg { width: 16px; height: 16px; }
.lang-menu { position: absolute; top: calc(100% + 8px); left: 0; min-width: 170px; padding: 6px; margin: 0; list-style: none; border-radius: 14px; background: rgba(6, 30, 16, 0.95); border: 1px solid var(--line); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45); }
.lang-menu button { width: 100%; display: flex; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 9px 12px; border-radius: 9px; text-align: left; cursor: pointer; font-weight: 600; font-size: 15px; }
.lang-menu button:hover { background: rgba(190, 255, 210, 0.1); }
.lang-menu button[aria-checked="true"]::after { content: "✓"; color: var(--leaf-hi); }

.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.4vh, 24px); padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 40px); text-align: center; min-height: 0; }
.bot { position: relative; width: clamp(200px, 38vh, 420px); max-width: 74vw; }
.bot img { display: block; width: 100%; height: auto; transform-origin: 50% 82%; animation: hover 6.4s ease-in-out infinite, breathe 4.3s ease-in-out infinite;
  filter: drop-shadow(0 0 1.5px rgba(200, 255, 215, 0.9)) drop-shadow(0 0 20px rgba(61, 220, 90, 0.45)) drop-shadow(0 24px 30px rgba(0, 0, 0, 0.5)); }
.bot::after { content: ""; position: absolute; left: 24%; right: 24%; bottom: -12px; height: 20px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, 0.5), transparent); animation: shadow 6.4s ease-in-out infinite; }
@keyframes hover { 0%, 100% { translate: 0 0; rotate: -0.6deg; } 50% { translate: 0 -6px; rotate: 0.6deg; } }
@keyframes breathe { 0%, 100% { scale: 1; } 50% { scale: 1.012; } }
@keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.9; } 50% { transform: scaleX(0.92); opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) { .bot img, .bot::after { animation: none; } }

.tagline { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(21px, 3.3vw, 36px); line-height: 1.16; letter-spacing: -0.01em; text-wrap: balance; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.7); max-width: 22ch; }
.tagline em { font-style: normal; color: var(--leaf-hi); }
.cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 24px; border-radius: 999px; font-weight: 800; font-size: 16px; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease; }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn-ghost { background: rgba(250, 252, 248, 0.16); border-color: rgba(250, 252, 248, 0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.btn-ghost:hover { background: rgba(250, 252, 248, 0.28); }
.btn-solid { background: var(--leaf); color: var(--ink); box-shadow: 0 10px 34px rgba(61, 220, 90, 0.42); }
.btn-solid:hover { background: var(--leaf-hi); }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ── Shared text for the secondary screens ────────── */
.topback { display: inline-flex; align-items: center; gap: 8px; color: var(--mist); text-decoration: none; font-weight: 700; font-size: 14px; padding: 6px 0; }
.topback:hover { color: var(--paper); }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--leaf-hi); margin: 0 0 14px; }
h2.title { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4.4vw, 50px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 18px; text-wrap: balance; text-shadow: 0 2px 30px rgba(0, 40, 15, 0.6); }
.lede { color: var(--mist); max-width: 58ch; margin: 0; font-size: 17px; }

/* ── Showcase ("What does Mellonbek do") ───────────────── */
.showcase { min-height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; }
.show-top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; max-width: 1180px; width: 100%; margin: 0 auto; }
.tabs { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16); margin-top: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: 100%; }
.tab { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 20px; border-radius: 999px; font-weight: 800; font-size: 16px; cursor: pointer; color: var(--mist); white-space: nowrap; transition: background 0.3s ease, color 0.3s ease; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); }
.tab svg { width: 18px; height: 18px; flex: none; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 7vw, 84px); line-height: 1; letter-spacing: -0.03em; margin: clamp(18px, 3.2vh, 34px) 0 12px; text-shadow: 0 4px 40px rgba(0, 60, 20, 0.55); }
.big-sub { margin: 0 auto; max-width: 52ch; color: var(--mist); font-size: clamp(16px, 1.6vw, 20px); min-height: 3.1em; text-wrap: balance; }
.fade { transition: opacity 0.35s ease, transform 0.35s ease; }
.fade.out { opacity: 0; transform: translateY(8px); }

.device-row { position: relative; width: 100%; max-width: 1180px; margin: clamp(14px, 2.5vh, 26px) auto 0; display: flex; justify-content: center; }
.laptop { width: min(960px, 100%, calc((100svh - 360px) * 1.62)); min-width: min(560px, 100%); }
.lid { border-radius: 22px 22px 8px 8px; padding: 12px 12px 14px; background: linear-gradient(160deg, #31373b, #0c0e0f); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 80px rgba(80, 255, 140, 0.22), inset 0 0 0 1.5px rgba(255, 255, 255, 0.1); }
.base { height: 16px; margin: 0 -7%; border-radius: 0 0 22px 22px; background: linear-gradient(180deg, #d6dbde, #8b9296 70%, #5d6468); position: relative; box-shadow: 0 18px 30px rgba(0, 0, 0, 0.35); }
.base::before { content: ""; position: absolute; left: 50%; top: 0; width: 16%; height: 6px; translate: -50% 0; border-radius: 0 0 10px 10px; background: rgba(0, 0, 0, 0.25); }

.tgd { aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); background: var(--tg-bg); font-family: var(--tg-font); font-size: 13px; line-height: 1.36; color: #fff; text-align: left; position: relative; }
.side { background: var(--tg-side); border-right: 1px solid #0b1118; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.side-top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px; }
.dots3 { display: flex; gap: 6px; padding-right: 4px; }
.dots3 i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.search { flex: 1; min-width: 0; background: #242f3d; color: var(--tg-meta); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.chats { list-style: none; margin: 0; padding: 4px; display: grid; gap: 2px; }
.chat-item { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 10px; }
.chat-item.active { background: var(--tg-active); }
.ci-ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 16px; }
.ci-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-prev { color: #8fa3b5; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.active .ci-prev { color: #d6e6f7; }
.ci-meta { display: grid; justify-items: end; gap: 3px; font-size: 11.5px; color: var(--tg-meta); }
.active .ci-meta { color: #d6e6f7; }
.badge { background: #3e546a; color: #fff; border-radius: 999px; min-width: 19px; height: 19px; padding: 0 5px; display: grid; place-items: center; font-size: 11px; font-weight: 600; }

.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.tg-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--tg-head); border-bottom: 1px solid #0b1118; }
.tg-group { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 16px; background: linear-gradient(135deg, #ffb661, #f37b39); flex: none; }
.tg-title { min-width: 0; flex: 1; }
.tg-title b { display: block; font-size: 14px; font-weight: 600; }
.tg-sub { font-size: 12px; color: var(--tg-meta); }
.tg-sub.typing { color: var(--tg-link); }
.tg-sub.typing::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.head-icons { display: flex; gap: 14px; color: var(--tg-meta); }
.head-icons svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tg-chat { flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; background-color: var(--tg-bg);
  background-image: radial-gradient(circle at 20% 30%, rgba(106, 179, 243, 0.05) 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, rgba(106, 179, 243, 0.04) 0 2px, transparent 3px), radial-gradient(circle at 45% 60%, rgba(103, 209, 111, 0.035) 0 1.5px, transparent 2.5px);
  background-size: 46px 46px, 62px 62px, 38px 38px; }
.day { align-self: center; font-size: 12px; padding: 3px 10px; border-radius: 12px; background: rgba(0, 0, 0, 0.32); color: #d7e3ee; flex: none; }
.msg { display: flex; align-items: flex-end; gap: 7px; flex: none; transition: opacity 0.35s ease, transform 0.35s ease; }
.msg.out { justify-content: flex-end; }
.msg.enter { opacity: 0; transform: translateY(12px); }
.ava { width: 30px; height: 30px; border-radius: 50%; background: #1f8f3a url("assets/grin-avatar.webp") center / 118% no-repeat; flex: none; }
.col { display: flex; flex-direction: column; gap: 3px; max-width: min(78%, 380px); min-width: 0; }
.bubble { padding: 6px 9px 6px 10px; border-radius: 14px; background: var(--tg-in); overflow-wrap: anywhere; }
.out .bubble { background: var(--tg-out); border-bottom-right-radius: 5px; }
.in .bubble { border-bottom-left-radius: 5px; }
.who { color: var(--tg-name); font-weight: 600; font-size: 12.5px; margin-bottom: 1px; }
.quote { border-left: 2.5px solid var(--tg-link); background: rgba(106, 179, 243, 0.1); border-radius: 4px; padding: 2px 7px; margin: 2px 0 5px; font-size: 12px; line-height: 1.3; }
.quote b { display: block; color: var(--tg-link); font-weight: 600; }
.quote span { color: #c6d3df; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bill { white-space: pre-line; font-variant-numeric: tabular-nums; }
.meta { float: right; margin: 6px 0 -4px 10px; font-size: 11px; color: rgba(255, 255, 255, 0.5); display: inline-flex; gap: 3px; align-items: center; }
.out .meta { color: #a3c5e6; }
.kb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.kb span { text-align: center; padding: 7px 4px; border-radius: 8px; background: var(--tg-btn); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s ease, transform 0.2s ease; }
.kb span.press { background: rgba(106, 179, 243, 0.75); transform: scale(0.95); }
.voice { display: flex; align-items: center; gap: 9px; min-width: 200px; padding: 2px 0; }
.play { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.play::before { content: ""; border-left: 11px solid var(--tg-out); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
.wave { display: flex; align-items: center; gap: 2px; height: 24px; }
.wave i { display: block; width: 3px; border-radius: 2px; background: #7ea8d1; transition: background 0.1s linear; }
.wave i.lit { background: #fff; }
.vlen { font-size: 11.5px; color: #a3c5e6; }
.toast { position: absolute; left: 50%; top: 44%; translate: -50% 0; padding: 8px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.82); font-size: 13px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
.toast.show { opacity: 1; }
.tg-input { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--tg-head); color: var(--tg-meta); font-size: 13.5px; }
.tg-input .field { flex: 1; }
.tg-input .rec { display: none; flex: 1; align-items: center; gap: 8px; color: #fff; font-variant-numeric: tabular-nums; }
.tg-input .rec i { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; animation: blink 1s ease-in-out infinite; }
.tg-input .rec span { color: var(--tg-meta); }
.tg-input .mic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; transition: background 0.2s ease, transform 0.2s ease; }
.tg-input.recording .field { display: none; }
.tg-input.recording .rec { display: flex; }

const ORDER = { about: -1, main: 0, how: 1, demo: 2 };
const track = $("track");
const appEl = document.querySelector(".app");
// The screens move only by the track; never let focus or "scroll into view" shift the stack itself.
appEl.addEventListener("scroll", () => { appEl.scrollTop = 0; appEl.scrollLeft = 0; });
track.addEventListener("scroll", () => { track.scrollTop = 0; track.scrollLeft = 0; });
const views = [...document.querySelectorAll(".view")];
let current = "main";

function go(name, instant) {
  if (!(name in ORDER)) name = "main";
  const was = current;
  current = name;
  if (instant) track.style.transition = "none";
  track.style.transform = `translateY(${-ORDER[name] * 100}%)`;
  if (instant) { track.getBoundingClientRect(); track.style.transition = ""; }
  views.forEach((v) => { const on = v.dataset.view === name; v.inert = !on; v.setAttribute("aria-hidden", String(!on)); });
  appEl.scrollTop = 0; track.scrollTop = 0;
  if (name === "how" && was !== "how") show.start(instant ? 0 : 900);
  if (name !== "how") show.stop();
}
const fromHash = () => ({ "#about": "about", "#how": "how", "#demo": "demo" })[location.hash] || "main";
addEventListener("hashchange", () => go(fromHash()));
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-go]"); if (!a) return;
  e.preventDefault();
  const name = a.dataset.go;
  const target = views.find((v) => v.dataset.view === name)?.querySelector(".scroll");
  if (target) target.scrollTop = 0;
  try { history.replaceState(null, "", name === "main" ? "#home" : "#" + name); } catch {}
  go(name);
});

    return recMs;
  }
  function bot(text, time, kb, instant) {
    return add(`<span class="ava"></span><div class="col"><div class="bubble"><div class="who">Mellonbek</div><div class="quote"><b>${c.you}</b><span>${c.voice}</span></div><div class="bill">${esc(text)}</div><span class="meta">${time}</span></div>${kb ? `<div class="kb">${c.kb.map((k) => `<span>${k}</span>`).join("")}</div>` : ""}</div>`, "in", instant);
  }

  /* Each tab is three slides; each slide is a few timed steps in the chat. */
  const SCRIPT = {
    bill: [
      { dur: 6400, run: (i) => voice("0:06", "09:15", i, c.v1) },
      { dur: 5200, run: (i) => { later(0, () => typing(true), i); later(1500, () => { typing(false); billMsg = bot(c.billDraft, "09:15", true, i); }, i); } },
      { dur: 4600, run: (i) => {
        later(900, () => billMsg.querySelector(".kb span")?.classList.add("press"), i);
        later(1400, () => { billMsg.querySelector(".kb")?.remove(); billMsg.querySelector(".bill").textContent = c.billDone; if (!i) { toast.textContent = c.done; toast.classList.add("show"); } }, i);
        later(2900, () => toast.classList.remove("show"), i);
      } },
    ],
    ask: [
      { dur: 7000, run: (i) => voice("0:04", "17:02", i, c.q1) },
      { dur: 5000, run: (i) => { later(0, () => typing(true), i); later(1400, () => { typing(false); bot(c.a1, "17:02", false, i); }, i); } },
      { dur: 9800, run: (i) => { const r = voice("0:03", "17:03", i, c.q2); later(r + 1300, () => typing(true), i); later(r + 2600, () => { typing(false); bot(c.a2, "17:03", false, i); }, i); } },
    ],
  };

  function renderText(animate) {
    const [h, p] = T[lang][tab][slide];
    const apply = () => { title.textContent = h; desc.textContent = p; title.classList.remove("out"); desc.classList.remove("out"); };
    if (animate && !reduce) { title.classList.add("out"); desc.classList.add("out"); setTimeout(apply, 260); } else apply();
    dots.innerHTML = SCRIPT[tab].map((_, i) => `<button class="dot" type="button" data-i="${i}" aria-label="${T[lang].slide} ${i + 1}" ${i === slide ? 'aria-current="true"' : ""}></button>`).join("");
    tabs.forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute("aria-label", playing ? T[lang].pause : T[lang].play);
  }

  function go(t, s, { animate = true } = {}) {
    timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); timers = []; clearTimeout(advance);
    inputBar.classList.remove("recording"); caption.classList.remove("on", "away");
    const textChanged = t !== tab || s !== slide;
    tab = t; slide = s; c = CHAT[lang]; billMsg = null;
    chat.innerHTML = `<span class="day">${c.today}</span>`;
    toast.classList.remove("show"); typing(false); field.textContent = c.input;
    SCRIPT[tab].slice(0, slide).forEach((step) => step.run(true));       // what already happened
    const instant = !animate || reduce;
    SCRIPT[tab][slide].run(instant);                                       // this slide, animated
    if (instant) typing(false);
    renderText(animate && textChanged);
    if (playing && !reduce && current === "how") advance = setTimeout(next, SCRIPT[tab][slide].dur + 1400);
  }
  function next() {
    if (slide + 1 < SCRIPT[tab].length) go(tab, slide + 1);
    else go(tab === "bill" ? "ask" : "bill", 0);
  }

  tabs.forEach((b) => b.addEventListener("click", () => go(b.dataset.tab, 0)));
  dots.addEventListener("click", (e) => { const d = e.target.closest(".dot"); if (d) go(tab, Number(d.dataset.i)); });
  playBtn.addEventListener("click", () => {
    playing = !playing;
    clearTimeout(advance);
    if (playing) next(); else renderText(false);
  });

  function renderSide() {
    $("search").textContent = c.search;
    const items = [["Ситрус Савдо", c.active, "09:15", 0, "linear-gradient(135deg,#ffb661,#f37b39)", true], ...c.side];
    $("chats").innerHTML = items.map(([name, prev, time, unread, bg, active]) =>
      `<li class="chat-item${active ? " active" : ""}"><span class="ci-ava" style="background:${bg}">${name[0]}</span><span style="min-width:0"><div class="ci-name">${name}</div><div class="ci-prev">${prev}</div></span><span class="ci-meta"><span>${time}</span>${unread ? `<span class="badge">${unread}</span>` : ""}</span></li>`).join("");
  }

  return {
    setLang() { c = CHAT[lang]; renderSide(); go(tab, slide, { animate: false }); },
    start(delay) { timers.forEach(clearTimeout); clearTimeout(advance); playing = !reduce; c = CHAT[lang]; tab = "bill"; slide = 0; chat.innerHTML = `<span class="day">${c.today}</span>`; renderText(false); advance = setTimeout(() => go("bill", 0, { animate: true }), delay); },
    stop() { timers.forEach((t) => { clearTimeout(t); clearInterval(t); }); timers = []; clearTimeout(advance); inputBar.classList.remove("recording"); caption.classList.remove("on", "away"); },
    init() { renderSide(); go("bill", 2, { animate: false }); playing = !reduce; renderText(false); },
  };
})();

/* ═════════════ Language ═════════════ */
const langBtn = $("lang-btn"), langMenu = $("lang-menu");
langMenu.innerHTML = LANGS.map((l) => `<li role="none"><button type="button" role="menuitemradio" data-lang="${l.code}">${l.name}</button></li>`).join("");
function closeMenu() { langMenu.hidden = true; langBtn.setAttribute("aria-expanded", "false"); }
langBtn.addEventListener("click", () => { const open = langMenu.hidden; langMenu.hidden = !open; langBtn.setAttribute("aria-expanded", String(open)); });
langMenu.addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (!b) return; setLang(b.dataset.lang); closeMenu(); langBtn.focus(); });
document.addEventListener("click", (e) => { if (!e.target.closest(".lang")) closeMenu(); });
addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!langMenu.hidden) { closeMenu(); langBtn.focus(); return; }
  if (current !== "main") { try { history.replaceState(null, "", "#home"); } catch {} go("main"); }
});

function setLang(code) {
  lang = code;
  try { localStorage.setItem("grin-lang", code); } catch {}
  const t = T[code], meta = LANGS.find((l) => l.code === code);
  document.documentElement.lang = meta.html;
  $("lang-label").textContent = meta.name;
  const name = code === "uzc" ? "МЕЛЛОН<span>БЕК</span>" : "MELLON<span>BEK</span>";
  const mark = `<img src="assets/grinbook-logo.webp" width="64" height="64" alt=""><b>${name}</b>`;
  $("wordmark").innerHTML = mark;
  document.querySelectorAll("[data-brand]").forEach((el) => { el.innerHTML = mark; });
  document.title = code === "uzc" ? "Меллонбек" : "Mellonbek";
  langMenu.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.lang === code)));
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-th]").forEach((el) => { el.innerHTML = t[el.dataset.th]; });
  $("facts").innerHTML = t.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  $("demo-steps").innerHTML = t.demoSteps.map((s) => `<li><span>${s}</span></li>`).join("");
  show.setLang();
}

/* ═════════════ Wind ═════════════
   Soft specks of light and dust drift across the blurred bazaar in slow gusts. */
(() => {
  const cv = $("wind"); if (reduce || !cv.getContext) return;
  const ctx = cv.getContext("2d");
  let w = 0, h = 0, dpr = 1, specks = [], t0 = performance.now();
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, (w * h) / 22000));
    specks = Array.from({ length: n }, () => spawn(true));
  }
  function spawn(anywhere) {
    const r = Math.random();
    return {
      x: anywhere ? Math.random() * w : -40, y: Math.random() * h,
      size: r < 0.75 ? 1.2 + Math.random() * 2.2 : 6 + Math.random() * 16,   // dust, and a few soft bokeh lights
      speed: 14 + Math.random() * 30, drift: Math.random() * Math.PI * 2,
      alpha: r < 0.75 ? 0.35 + Math.random() * 0.4 : 0.08 + Math.random() * 0.12,
      warm: Math.random() < 0.6,
    };
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (current !== "main" || document.hidden) return;
    const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
    const gust = 1 + 1.6 * Math.max(0, Math.sin(now / 4200)) ** 3;       // every few seconds the wind picks up
    ctx.clearRect(0, 0, w, h);
    for (const p of specks) {
      p.x += p.speed * gust * dt;
      p.y += Math.sin(now / 1300 + p.drift) * 6 * dt - 2 * dt;
      if (p.x > w + 40 || p.y < -40) Object.assign(p, spawn(false));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      const col = p.warm ? "255, 236, 190" : "220, 255, 225";
      g.addColorStop(0, `rgba(${col}, ${p.alpha})`); g.addColorStop(1, `rgba(${col}, 0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  addEventListener("resize", size); size(); requestAnimationFrame(frame);
})();

show.init();
setLang(lang);
go(fromHash(), true);
})();
</script>
